[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerfunc"
version = "0.3.0"
description = "Make functions run however you like — CLI, pipeline, or remote compute"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "cloudpathlib[all]",
    "fsspec[gcs,s3,adl]",
    "jsonargparse>=4.49.0",
    "cloudpickle",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-run",
    "google-cloud-batch",
    "google-cloud-compute",
    "google-auth",
]
modal = [
    "modal",
]
dev = [
    "tox",
    "tox-uv",
    "ruff",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/ddrakard/powerfunc"
Repository = "https://github.com/ddrakard/powerfunc"
Documentation = "https://github.com/ddrakard/powerfunc/blob/main/documentation/readme.md"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "cloudpickle>=3.1.2",
    "modal>=1.2.6",
]
