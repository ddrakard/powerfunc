[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerfunc"
version = "0.1.0"
description = "Make functions run however you like — CLI, pipeline, or remote compute"
requires-python = ">=3.9"
dependencies = [
    "pydantic",
    "cloudpathlib[all]",
    "jsonargparse>=4.49.0",
    "cloudpickle",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-run",
    "google-auth",
]
modal = [
    "modal",
]
dev = [
    "pytest",
    "pandas",
    "polars",
    "pyarrow",
    "openpyxl",
    "xlsxwriter",
    "fastexcel",
    "dask[dataframe]",
    "gcsfs",
    "ruff",
    "pre-commit",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]

[dependency-groups]
dev = [
    "cloudpickle>=3.1.2",
    "modal>=1.2.6",
]
