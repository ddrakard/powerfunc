name: CI

on:
  push:
  pull_request:

# One run per branch. Keying on the head branch (not github.ref) makes the
# push and pull_request events for the same branch share a group, so we get a
# single run per commit instead of two, and a new push cancels an in-progress
# run for the same branch so live remote tests can't pile up.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uvx --with tox-uv tox run -e core

  test-gcp:
    # Live cloud tests need the repository's secrets, which GitHub does not give to
    # pull requests from forks; skip them there rather than fail. To run them on a
    # fork's PR, push its commit to a branch here after reviewing it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs share one GCP project, and each ends by deleting every running pf-* job in
    # it, so overlapping runs (e.g. a push to main and its release tag) would delete
    # each other's jobs. Queue them across all branches and tags instead.
    concurrency:
      group: live-gcp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run GCP tests
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GCP_BUCKET: gs://powerfunc-temporary-348293
          GCP_REGION: europe-west4
        run: uvx --with tox-uv tox run -e gcp
      # Runs even when the tests fail or the run is cancelled, so a killed test
      # cannot leave a job (and its GPU quota) running behind later runs.
      - name: Delete leftover cloud jobs
        if: always()
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GCP_REGION: europe-west4
        run: uv run --no-project --with google-cloud-batch --with google-cloud-run python tests/powerfunc_tests/cleanup.py

  test-modal:
    # Live cloud tests need the repository's secrets, which GitHub does not give to
    # pull requests from forks; skip them there rather than fail. To run them on a
    # fork's PR, push its commit to a branch here after reviewing it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares the Modal account and the GCP bucket across runs; queue like test-gcp.
    concurrency:
      group: live-modal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run Modal tests
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GCP_BUCKET: gs://powerfunc-temporary-348293
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uvx --with tox-uv tox run -e modal
