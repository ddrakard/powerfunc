[tox]
requires = tox-uv
env_list = core, gcp, modal

[testenv]
deps =
    pytest
    pytest-xdist
    pandas
    polars
    pyarrow
    openpyxl
    xlsxwriter
    fastexcel
    dask[dataframe]
    snakemake

# Core tests: only base dependencies + data libraries.
# Catches missing deps in the core package.
[testenv:core]
commands =
    pytest tests/powerfunc_tests/core tests/powerfunc_tests/snakemake -n auto -v {posargs}

# GCP tests: gcp extra + shared test deps.
# Catches missing deps in the gcp extra.
[testenv:gcp]
extras = gcp
pass_env =
    GOOGLE_CLOUD_API_KEY
    GCP_BUCKET
    GCP_REGION
commands =
    pytest tests/powerfunc_tests/gcp -n 8 -v {posargs}

# Modal tests: modal extra + shared test deps.
# Catches missing deps in the modal extra.
[testenv:modal]
extras = modal
pass_env =
    MODAL_TOKEN_ID
    MODAL_TOKEN_SECRET
commands =
    pytest tests/powerfunc_tests/modal -n auto -v {posargs}
